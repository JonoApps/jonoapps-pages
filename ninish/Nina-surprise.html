<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A gift for Nina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0F1226;
    --navy:#171B3A;
    --wrap-1:#4A78E0;
    --wrap-2:#2C4EB8;
    --wrap-3:#1E3A96;
    --silver-light:#F2F5F9;
    --silver:#C9D1DC;
    --silver-dark:#828FA1;
    --larimar:#2E9FB0;
    --larimar-light:#7FD8E0;
    --larimar-deep:#155E72;
    --coral:#FF8F6B;
    --ink:#ECEEF7;
    --ink-dim:#A9AFCB;
    --card:#1B2049;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(120% 90% at 50% 0%, var(--navy) 0%, var(--navy-deep) 60%, #090B1A 100%);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }

  .stage{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6vh 20px calc(6vh + env(safe-area-inset-bottom));
    position:relative;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:14px;
    font-weight:600;
    opacity:0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay:0.1s;
  }

  .gift-wrap-outer{
    position:relative;
    width:min(72vw, 300px);
    height:min(72vw, 300px);
    opacity:0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay:0.25s;
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .box-shadow-glow{
    position:absolute;
    inset:-30px;
    background: radial-gradient(circle, rgba(74,120,224,0.35) 0%, rgba(74,120,224,0) 70%);
    filter: blur(6px);
    z-index:0;
    pointer-events:none;
  }

  #scratchCanvas{
    position:relative;
    width:100%;
    height:100%;
    border-radius:22.37%; /* app-icon superellipse-ish rounding */
    display:block;
    touch-action:none;
    cursor:grab;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    z-index:2;
  }

  .reveal-card{
    position:absolute;
    inset:0;
    border-radius:22.37%;
    overflow:hidden;
    background:var(--card);
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .reveal-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* hanging gift tag */
  .tag-string{
    position:absolute;
    top:-26px;
    right:38px;
    width:2px;
    height:30px;
    background: linear-gradient(to bottom, transparent, var(--silver-dark));
    z-index:4;
    transform-origin:top center;
    animation: sway 3.2s ease-in-out infinite;
  }
  .tag{
    position:absolute;
    top:2px;
    right:14px;
    background:#F4EFE3;
    color:#2A2417;
    padding:7px 12px 8px;
    border-radius:4px 10px 10px 4px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:13px;
    line-height:1.15;
    box-shadow:0 6px 14px -4px rgba(0,0,0,0.4);
    transform:rotate(6deg);
    z-index:4;
    animation: sway 3.2s ease-in-out infinite;
    transform-origin: -10px -20px;
    white-space:nowrap;
  }
  .tag::before{
    content:'';
    position:absolute;
    left:-3px; top:9px;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--navy-deep);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
  }
  @keyframes sway{
    0%,100%{transform:rotate(6deg);}
    50%{transform:rotate(2deg);}
  }
  .tag-out{
    animation: tagFly 0.7s ease forwards !important;
  }
  @keyframes tagFly{
    to{ transform:translateY(-60px) rotate(24deg); opacity:0; }
  }

  .hint{
    margin-top:26px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--ink-dim);
    font-size:14px;
    font-weight:500;
    opacity:0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay:0.7s;
  }
  .hint svg{ animation: swipeHint 1.6s ease-in-out infinite; }
  @keyframes swipeHint{
    0%,100%{ transform:translateX(0); opacity:0.6; }
    50%{ transform:translateX(10px); opacity:1; }
  }
  .hint.hidden{ opacity:0 !important; transition:opacity 0.3s ease; }

  .finish-tap{
    margin-top:14px;
    background:none;
    border:none;
    color:var(--larimar-light);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.4s ease;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-color:rgba(127,216,224,0.4);
    text-underline-offset:3px;
  }
  .finish-tap.show{ opacity:1; pointer-events:auto; }

  /* ---- revealed state ---- */
  .revealed-info{
    margin-top:28px;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    max-width: 320px;
  }
  .revealed-info.show{ opacity:1; transform:translateY(0); }

  .app-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
    color:var(--ink);
  }
  .app-sub{
    font-size:14px;
    color:var(--ink-dim);
    margin:0 0 18px;
    font-weight:500;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(46,159,176,0.14);
    border:1px solid rgba(46,159,176,0.4);
    color:var(--larimar-light);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .badge::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
    background:var(--larimar-light);
    box-shadow:0 0 8px var(--larimar);
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background: linear-gradient(135deg, var(--silver-light), var(--silver) 55%, var(--silver-dark));
    color:#123645;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:15.5px;
    padding:14px 26px;
    border-radius:100px;
    text-decoration:none;
    box-shadow: 0 10px 24px -8px rgba(46,159,176,0.45);
    animation: pulseCta 2.4s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes pulseCta{
    0%,100%{ box-shadow: 0 10px 24px -8px rgba(46,159,176,0.45); transform:scale(1); }
    50%{ box-shadow: 0 14px 30px -6px rgba(46,159,176,0.65); transform:scale(1.03); }
  }
  .cta svg{ flex-shrink:0; }

  .footnote{
    margin-top:16px;
    font-size:11.5px;
    color:var(--ink-dim);
    opacity:0.75;
  }

  /* confetti */
  .confetti-piece{
    position:fixed;
    top:38%;
    left:50%;
    width:8px;
    height:8px;
    border-radius:2px;
    opacity:0;
    z-index:10;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .hint svg, .cta, .tag-string, .tag{ animation:none !important; }
  }
</style>
</head>

<script>
(function(){
  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d');
  const outer = document.getElementById('giftOuter');
  const hint = document.getElementById('hint');
  const finishTap = document.getElementById('finishTap');
  const revealedInfo = document.getElementById('revealedInfo');
  const tag = document.getElementById('tag');
  const tagString = document.getElementById('tagString');
  let W, H, dpr;
  let unwrapped = false;
  let hasInteracted = false;
  let drawing = false;
  let last = null;

  function sizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawWrap();
  }

  function drawWrap(){
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,W,H);

    // base gradient
    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, '#5A8AF0');
    grad.addColorStop(0.55, '#3E6FE0');
    grad.addColorStop(1, '#22409E');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // diagonal stripe texture
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#1E3A96';
    ctx.lineWidth = Math.max(6, W*0.045);
    const step = Math.max(18, W*0.11);
    for(let x = -H; x < W+H; x += step){
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x+H, H);
      ctx.stroke();
    }
    ctx.restore();

    // ribbon - vertical (brushed sterling silver)
    const ribbonW = W * 0.16;
    ctx.save();
    const rGrad = ctx.createLinearGradient(W/2 - ribbonW/2, 0, W/2 + ribbonW/2, 0);
    rGrad.addColorStop(0, '#7C889A');
    rGrad.addColorStop(0.28, '#E7ECF2');
    rGrad.addColorStop(0.5, '#F7FAFD');
    rGrad.addColorStop(0.72, '#C3CCD8');
    rGrad.addColorStop(1, '#7C889A');
    ctx.fillStyle = rGrad;
    ctx.fillRect(W/2 - ribbonW/2, 0, ribbonW, H);
    // ribbon - horizontal
    const hGrad = ctx.createLinearGradient(0, H/2 - ribbonW/2, 0, H/2 + ribbonW/2);
    hGrad.addColorStop(0, '#7C889A');
    hGrad.addColorStop(0.28, '#E7ECF2');
    hGrad.addColorStop(0.5, '#F7FAFD');
    hGrad.addColorStop(0.72, '#C3CCD8');
    hGrad.addColorStop(1, '#7C889A');
    ctx.fillStyle = hGrad;
    ctx.fillRect(0, H/2 - ribbonW/2, W, ribbonW);
    // fold-crease highlight down the middle of each band
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = Math.max(1.5, ribbonW*0.05);
    ctx.beginPath();
    ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
    ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
    ctx.stroke();
    ctx.restore();

    // bow at center — traditional loops, tails, and knot (sterling silver)
    ctx.save();
    ctx.translate(W/2, H/2);

    const gemR = ribbonW * 0.5;
    const bezelR = gemR * 1.22;
    const loopLen = W * 0.155;
    const loopH = W * 0.105;

    function silverGrad(x0,y0,x1,y1){
      const g = ctx.createLinearGradient(x0,y0,x1,y1);
      g.addColorStop(0, '#8C97A6');
      g.addColorStop(0.45, '#F2F5F9');
      g.addColorStop(0.75, '#D3DAE3');
      g.addColorStop(1, '#8C97A6');
      return g;
    }

    function drawTail(mirror){
      const tw = bezelR * 1.1;
      const len = W * 0.185;
      const notch = tw * 0.5;
      ctx.save();
      ctx.rotate(mirror * 0.32);
      ctx.beginPath();
      ctx.moveTo(-tw/2, 0);
      ctx.lineTo(tw/2, 0);
      ctx.lineTo(tw/2, len);
      ctx.lineTo(0, len - notch);
      ctx.lineTo(-tw/2, len);
      ctx.closePath();
      ctx.fillStyle = silverGrad(-tw/2, 0, tw/2, len);
      ctx.fill();
      ctx.strokeStyle = '#7C889A';
      ctx.lineWidth = W*0.004;
      ctx.stroke();
      ctx.restore();
    }

    function drawLoop(mirror){
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(mirror*loopLen*0.22, -loopH*1.05, mirror*loopLen*1.05, -loopH*0.8, mirror*loopLen*0.95, -loopH*0.1);
      ctx.bezierCurveTo(mirror*loopLen*0.82, loopH*0.4, mirror*loopLen*0.28, loopH*0.3, 0, 0);
      ctx.closePath();
      ctx.fillStyle = silverGrad(0, -loopH, mirror*loopLen, 0);
      ctx.fill();
      ctx.strokeStyle = '#7C889A';
      ctx.lineWidth = W*0.005;
      ctx.stroke();
      // fold shading down the loop
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = '#7C889A';
      ctx.lineWidth = W*0.004;
      ctx.beginPath();
      ctx.moveTo(mirror*loopLen*0.08, -loopH*0.05);
      ctx.quadraticCurveTo(mirror*loopLen*0.55, -loopH*0.72, mirror*loopLen*0.88, -loopH*0.3);
      ctx.stroke();
      ctx.restore();
    }

    // tails emerge from behind the gem
    ctx.save();
    ctx.translate(0, bezelR*0.5);
    drawTail(1);
    drawTail(-1);
    ctx.restore();

    // loops sit above the gem
    ctx.save();
    ctx.translate(0, -bezelR*0.75);
    drawLoop(1);
    drawLoop(-1);
    ctx.restore();

    // thin sterling silver bezel border
    ctx.beginPath();
    ctx.ellipse(0, 0, bezelR, bezelR*0.88, 0, 0, Math.PI*2);
    ctx.fillStyle = silverGrad(-bezelR, -bezelR, bezelR, bezelR);
    ctx.fill();
    ctx.strokeStyle = '#7C889A';
    ctx.lineWidth = W*0.004;
    ctx.stroke();

    // Larimar gem, set inside the bezel
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, gemR, gemR*0.86, 0, 0, Math.PI*2);
    ctx.clip();
    const gemGrad = ctx.createRadialGradient(-gemR*0.3, -gemR*0.3, gemR*0.1, 0, 0, gemR*1.1);
    gemGrad.addColorStop(0, '#7FD8E0');
    gemGrad.addColorStop(0.45, '#2E9FB0');
    gemGrad.addColorStop(1, '#155E72');
    ctx.fillStyle = gemGrad;
    ctx.fillRect(-gemR, -gemR, gemR*2, gemR*2);
    // marbled veins - distinct, not cloudy
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#EAF7F8';
    ctx.lineWidth = gemR*0.11;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-gemR, -gemR*0.15);
    ctx.bezierCurveTo(-gemR*0.3, -gemR*0.55, gemR*0.2, gemR*0.1, gemR, -gemR*0.1);
    ctx.stroke();
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = gemR*0.07;
    ctx.beginPath();
    ctx.moveTo(-gemR*0.5, gemR*0.55);
    ctx.bezierCurveTo(-gemR*0.05, gemR*0.15, gemR*0.25, gemR*0.4, gemR*0.8, gemR*0.05);
    ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(0, 0, gemR, gemR*0.86, 0, 0, Math.PI*2);
    ctx.strokeStyle = '#7C889A';
    ctx.lineWidth = W*0.004;
    ctx.stroke();

    ctx.restore();

    // rounded mask (match superellipse-ish corners) via compositing
    ctx.globalCompositeOperation = 'destination-in';
    roundRectPath(ctx, 0, 0, W, H, W*0.2237);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function roundRectPath(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  // ---- scratch logic ----
  const sampleCanvas = document.createElement('canvas');
  sampleCanvas.width = 24; sampleCanvas.height = 24;
  const sampleCtx = sampleCanvas.getContext('2d');

  function erasedPercent(){
    sampleCtx.clearRect(0,0,24,24);
    sampleCtx.drawImage(canvas, 0, 0, 24, 24);
    const data = sampleCtx.getImageData(0,0,24,24).data;
    let transparent = 0;
    let total = 0;
    for(let i=0; i<data.length; i+=4){
      total++;
      if(data[i+3] < 60) transparent++;
    }
    return (transparent/total) * 100;
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }

  function scratchAt(x, y){
    const r = Math.max(18, W*0.13);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = r*2;
    ctx.beginPath();
    if(last){
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(x, y);
    } else {
      ctx.moveTo(x, y);
      ctx.lineTo(x+0.1, y+0.1);
    }
    ctx.stroke();
    last = {x, y};
  }

  let checkQueued = false;
  function queueCheck(){
    if(checkQueued) return;
    checkQueued = true;
    requestAnimationFrame(()=>{
      checkQueued = false;
      if(unwrapped) return;
      const pct = erasedPercent();
      if(!hasInteracted && pct > 2){
        hasInteracted = true;
        hint.classList.add('hidden');
      }
      if(pct > 18 && !finishTap.classList.contains('show')){
        finishTap.classList.add('show');
      }
      if(pct >= 58){
        completeUnwrap();
      }
    });
  }

  function start(e){
    if(unwrapped) return;
    drawing = true;
    last = null;
    const pos = getPos(e);
    scratchAt(pos.x, pos.y);
    queueCheck();
    e.preventDefault();
  }
  function move(e){
    if(!drawing || unwrapped) return;
    const pos = getPos(e);
    scratchAt(pos.x, pos.y);
    queueCheck();
    e.preventDefault();
  }
  function end(){
    drawing = false;
    last = null;
  }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  finishTap.addEventListener('click', completeUnwrap);

  function completeUnwrap(){
    if(unwrapped) return;
    unwrapped = true;
    hint.classList.add('hidden');
    finishTap.classList.remove('show');

    canvas.style.transition = 'transform 0.6s cubic-bezier(.2,.8,.2,1), opacity 0.6s ease';
    canvas.style.transform = 'scale(1.15) rotate(4deg)';
    canvas.style.opacity = '0';

    tag.classList.add('tag-out');
    tagString.style.transition = 'opacity 0.5s ease';
    tagString.style.opacity = '0';

    setTimeout(()=>{
      canvas.style.display = 'none';
      revealedInfo.classList.add('show');
      burstConfetti();
    }, 380);
  }

  function burstConfetti(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#C9D1DC','#F2F5F9','#2E9FB0','#7FD8E0','#4A78E0'];
    const rect = outer.getBoundingClientRect();
    const originX = rect.left + rect.width/2;
    const originY = rect.top + rect.height/2;
    for(let i=0;i<26;i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const size = 5 + Math.random()*6;
      el.style.width = size+'px';
      el.style.height = size+'px';
      el.style.background = colors[i % colors.length];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.left = originX + 'px';
      el.style.top = originY + 'px';
      document.body.appendChild(el);

      const angle = Math.random() * Math.PI * 2;
      const dist = 90 + Math.random()*140;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 60;
      const rot = (Math.random()*720 - 360);
      const dur = 900 + Math.random()*500;

      el.animate([
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx}px, ${dy + 180}px) rotate(${rot}deg)`, opacity:0 }
      ], { duration: dur, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' });

      setTimeout(()=> el.remove(), dur+50);
    }
  }
})();
</script>
